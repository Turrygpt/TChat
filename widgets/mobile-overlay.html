<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TChat Mobile Overlay</title>
    <style>
      /* Сборный оверлей для TChat Live (Android): чат + общий стрим-оверлей
         (алерты, цель, стикеры) одним прозрачным полотном. Телефон «прожигает»
         эту страницу в кадр. Параметры: ?chat=1&alerts=1&goal=1&stickers=1&chatPos=left|right */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      iframe {
        position: absolute;
        border: 0;
        background: transparent;
        color-scheme: normal;
      }
      #streamFrame {
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #chatFrame {
        /* Положение и размер задаёт телефон через параметры chatX/Y/W/H.
           Значения по умолчанию — правый столбец, как раньше. */
        left: 64%;
        top: 6%;
        width: 34%;
        height: 56%;
        display: none;
      }
    </style>
  </head>
  <body class="chat-left">
    <iframe id="streamFrame" allowtransparency="true" title="Оверлей стрима"></iframe>
    <iframe id="chatFrame" allowtransparency="true" title="Чат"></iframe>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const on = (name) => params.get(name) === '1';

        // stream.html несёт алерты, цель, стикеры и опросы сразу; какие блоки
        // реально показывать — решают настройки виджетов на ПК (widgets:state).
        // Здесь он подключается, если включён хоть один из его блоков.
        const streamFrame = document.getElementById('streamFrame');
        if (on('alerts') || on('goal') || on('stickers')) {
          streamFrame.src = './stream.html';
        } else {
          streamFrame.remove();
        }

        const chatFrame = document.getElementById('chatFrame');
        if (on('chat')) {
          // Положение и размер в процентах кадра приходят с телефона.
          const num = (name, fallback) => {
            const v = parseFloat(params.get(name));
            return Number.isFinite(v) ? v : fallback;
          };
          const x = num('chatX', 64);
          const y = num('chatY', 6);
          const w = num('chatW', 34);
          const h = num('chatH', 56);
          const font = num('chatFont', 1);
          chatFrame.style.left = x + '%';
          chatFrame.style.top = y + '%';
          chatFrame.style.right = 'auto';
          chatFrame.style.bottom = 'auto';
          chatFrame.style.width = w + '%';
          chatFrame.style.height = h + '%';
          // Масштаб шрифта чата — пробрасываем в chat.html.
          chatFrame.src = './chat.html?font=' + encodeURIComponent(font);
          chatFrame.style.display = 'block';
        } else {
          chatFrame.remove();
        }
      })();
    </script>
  </body>
</html>
