<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TChat Video Overlay</title>
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent !important; }
      #videoOverlayCanvas { display: block; width: 100%; height: 100%; opacity: 0; background: transparent; transition: opacity 180ms ease; }
      #videoOverlayCanvas.is-visible { opacity: 1; }
      #videoOverlaySource { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="videoOverlayCanvas" aria-hidden="true"></canvas>
    <video id="videoOverlaySource" preload="auto" playsinline></video>
    <script src="./video-overlay.js"></script>
  </body>
</html>
