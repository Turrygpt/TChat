plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def donationClientId = providers.gradleProperty('tchatDonationClientId').getOrElse('19533')
if (donationClientId && !(donationClientId ==~ /[0-9]+/)) {
    throw new GradleException('tchatDonationClientId должен содержать только цифры')
}

android {
    namespace 'com.tchat.reader'
    compileSdk 37

    defaultConfig {
        applicationId 'com.tchat.reader'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
        buildConfigField 'String', 'DONATION_CLIENT_ID', groovy.json.JsonOutput.toJson(donationClientId)
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes.release.signingConfig = signingConfigs.debug
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    sourceSets.main.kotlin.srcDir(rootProject.file('shared/src/main/kotlin'))
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt.coil3:coil-compose:3.3.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.3.0'
    implementation 'io.coil-kt.coil3:coil-gif:3.3.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation('io.socket:socket.io-client:2.1.1') { exclude group: 'org.json', module: 'json' }
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
