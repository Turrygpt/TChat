<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; media-src 'self'">
    <style>
      html, body { margin: 0; background: transparent; }
      .stream-overlay { display: grid; place-items: center; }
      .stream-alert.stream-alert--overlay {
        position: relative;
        inset: auto;
        width: var(--alert-width, 42%);
        max-height: var(--alert-height, calc(100% - 24px));
      }
      .stream-alert__image[hidden], .stream-alert__message[hidden] { display: none; }
    </style>
    <link rel="stylesheet" href="widget.css">
    <script defer src="overlay.js"></script>
    <title>TChat</title>
  </head>
  <body class="widget-page widget-page--stream">
    <main class="stream-overlay">
      <section id="streamAlert" class="stream-alert stream-alert--overlay">
        <img id="streamAlertImage" class="stream-alert__image" alt="" hidden>
        <video id="streamAlertVideo" class="stream-alert__image" muted playsinline loop hidden></video>
        <div class="stream-alert__body">
          <strong id="streamAlertUser" class="stream-alert__user"></strong>
          <p id="streamAlertMessage" class="stream-alert__message" hidden></p>
        </div>
      </section>
    </main>
  </body>
</html>
